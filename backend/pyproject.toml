[project]
name = "super-doctor-backend"
version = "0.2.0"
description = "Super-Doctor — triage-first medical consultation agent system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "pydantic-ai-slim[openai]>=2.60",
  "sqlalchemy[asyncio]>=2.0",
  "greenlet>=3.0",
  "aiosqlite>=0.20",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
