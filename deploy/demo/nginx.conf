worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# Stay in the foreground: start.sh execs nginx, so daemonising would return immediately and the
# container would exit "successfully" right after boot.
daemon off;

# Everything that normally lives in /var/lib/nginx goes to /tmp, because the host may run the
# container as an unprivileged user and only /tmp is reliably writable.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    server {
        # __PORT__ is replaced by start.sh with $PORT (Render injects 10000 by default).
        listen __PORT__;
        server_name _;

        # FastAPI, including the SSE endpoint. Buffering must be off or the answer arrives
        # sentence by sentence in one lump at the end.
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The interactive API docs, handy when someone asks "is this backend real?".
        location = /docs {
            proxy_pass http://127.0.0.1:8000/docs;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000/openapi.json;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
